name: Backend CI

on:
  pull_request:
    paths:
      - "**/*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - backend-phase2

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand --testTimeout=30000
